# CareLoop — dev override (spec §28): bind mounts + hot reload INSIDE containers.
# Usage: make dev   (== docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d)
# The plain docker-compose.yml production-style build is for demo/verification runs.
#
# Mount targets are each image's WORKDIR — backend /srv/careloop, frontend /app
# (see backend/Dockerfile and frontend/Dockerfile). They differ; a mount at the
# wrong path leaves the baked copy in place and hot reload silently does nothing.

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/srv/careloop
    environment:
      APP_ENV: development

  frontend:
    command: npm run dev
    volumes:
      - ./frontend:/app
      # Named volumes shadow the bind mount so container-installed deps and the
      # build cache are NOT clobbered by the host directory.
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      NODE_ENV: development

volumes:
  frontend_node_modules:
  frontend_next_cache:
